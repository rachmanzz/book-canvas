<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer / Print Example - Book Canvas</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
      header { height: 50px; background: #ffffff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 1000; }
      .nav-left { display: flex; align-items: center; gap: 12px; }
      .back-btn { text-decoration: none; color: #64748b; font-size: 13px; font-weight: 500; }
      .back-btn:hover { color: #0f172a; }
      .title { font-weight: 600; font-size: 14px; color: #0f172a; }
      .controls { display: flex; gap: 8px; align-items: center; }
      button { padding: 5px 12px; font-size: 12px; font-weight: 500; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; cursor: pointer; }
      button:hover { background: #f1f5f9; }
      button.primary { background: #dc2626; color: #ffffff; border-color: #dc2626; }
      #canvas-host { flex: 1; width: 100%; height: calc(100vh - 50px); }

      @media print {
        header { display: none !important; }
        body, html { height: auto !important; overflow: visible !important; }
        #canvas-host { height: auto !important; background: transparent !important; }
        .book-canvas-content-wrapper { position: static !important; transform: none !important; padding: 0 !important; }
        .book-canvas-page { box-shadow: none !important; page-break-after: always; margin: 0 !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="nav-left">
        <a class="back-btn" href="../index.html">← Hub</a>
        <div class="title">PDF Preview & Print Layout Demo</div>
      </div>
      <div class="controls">
        <button id="btn-zoom-out">Zoom -</button>
        <span id="zoom-label" style="font-size: 12px; min-width: 40px; text-align: center">100%</span>
        <button id="btn-zoom-in">Zoom +</button>
        <button id="btn-reset">Reset</button>
        <button class="primary" id="btn-print">Print / Save PDF</button>
      </div>
    </header>
    <main id="canvas-host"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
